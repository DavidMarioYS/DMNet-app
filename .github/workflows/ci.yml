name: CI

on:
  pull_request:
  push:
    branches: [main]

# Hak akses minimum: workflow ini hanya perlu membaca isi repo
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi sesuai package-lock.json
        run: npm ci

      - name: Jalankan tes
        run: npm test
